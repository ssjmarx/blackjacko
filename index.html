<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="blackjacko — a card-counter blackjack campaign game" />
    <title>blackjacko</title>
    <style>
      /* The shell: the canvas fills the window; the DOM layer carries the
         accessibility state. viewport-fit=cover wires the safe-area insets
         for the phone wrappers (Tauri 2 / Capacitor, later milestones). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b5d3b;
      }
      #game,
      #game canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bj-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
        background: #10241b;
        color: #f5f0e1;
        border: 1px solid #2f6b4f;
        border-radius: 0.4em;
        padding: 0.25em 0.8em;
        font: 600 calc(var(--bjz-controls-h, 44px) * 0.3) system-ui, sans-serif;
        cursor: pointer;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 1 auto;
      }
      .bj-btn kbd {
        background: #f5f0e1;
        color: #10241b;
        border-radius: 0.3em;
        padding: 0.05em 0.4em;
        font: 700 0.82em monospace;
      }
      .bj-btn:not(:disabled):hover {
        border-color: #f5f0e1;
      }
      .bj-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #bj-controls {
        position: fixed;
        display: flex;
        flex-wrap: nowrap;
        justify-content: flex-end;
        gap: 0.5em;
        align-items: stretch;
        z-index: 35;
      }
      #bj-controls.flipped {
        justify-content: flex-start;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- The accessibility layer: the announcer speaks, the state panel mirrors
         the table. Action controls land here in pt4; the counts in pt6. -->
    <div id="sr-announcer" aria-live="polite" class="sr-only"></div>
    <div id="sr-state" role="status" class="sr-only"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
