<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="blackjacko — a card-counter blackjack campaign game" />
    <title>blackjacko</title>
    <style>
      /* The shell: the canvas fills the window; the DOM layer carries the
         accessibility state. viewport-fit=cover wires the safe-area insets
         for the phone wrappers (Tauri 2 / Capacitor, later milestones). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b5d3b;
      }
      #game,
      #game canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bj-btn {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.3em;
        box-sizing: border-box;
        background: var(--bjz-btn-paper, #ffffff);
        color: var(--bjz-btn-ink, #1a1a1a);
        border: 1px solid var(--bjz-btn-ink, #1a1a1a);
        border-radius: 6%;
        padding: 2%;
        font: 600 var(--bjz-btn-font, 13px) system-ui, sans-serif;
        cursor: pointer;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 0 auto;
        width: var(--bjz-btn-w, 64px);
        height: var(--bjz-btn-h, 90px);
      }
      .bj-btn kbd {
        background: var(--bjz-btn-ink, #1a1a1a);
        color: var(--bjz-btn-paper, #ffffff);
        border-radius: 0.3em;
        padding: 0.05em 0.4em;
        font: 700 0.8em monospace;
      }
      .bj-btn:not(:disabled):hover {
        box-shadow: 0 0 0 1px var(--bjz-btn-ink, #1a1a1a);
      }
      .bj-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #bj-controls {
        position: fixed;
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        z-index: 35;
      }
      #bj-controls.flipped {
        flex-direction: row-reverse;
      }
      #bj-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: var(--bjz-btn-gap, 8px);
        align-items: center;
        min-width: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- The accessibility layer: the announcer speaks, the state panel mirrors
         the table. Action controls land here in pt4; the counts in pt6. -->
    <div id="sr-announcer" aria-live="polite" class="sr-only"></div>
    <div id="sr-state" role="status" class="sr-only"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
